apiVersion: v1
kind: Service
metadata:
  name: {{ "{{ template \"fullname\" . }}" }}
  labels:
    app: {{ "{{ template \"fullname\" . }}" }}
    chart: {{ "\"{{ .Chart.Service.Name }}-{{ .Chart.Version }}\"" }}
    release: {{ "\"{{ .Release.Service.Name }}\"" }}
    heritage: {{ "\"{{ .Release.Service }}\"" }}
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: {{ "{{ template \"fullname\" . }}" }}
