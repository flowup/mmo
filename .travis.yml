language: go

go:
  - 1.8.x
  - master

install:
  - go get github.com/mattn/goveralls
  - go get -u github.com/golang/dep/cmd/dep
  - go get -u github.com/golang/lint/golint
  - dep ensure

script:
  - go build github.com/flowup/mmo
  - golint $(glide nv)
  - $HOME/gopath/bin/goveralls -service=travis-ci